name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: ./mvnw -B -f backend/pom.xml verify
      - run: npm ci && npm test && npm run build
        working-directory: frontend
      - run: cp .env.example .env && docker compose up --build -d --wait --wait-timeout 180
      - run: python3 scripts/smoke.py
      - run: python3 scripts/persistence.py
      - run: python3 scripts/check_acceptance.py --results
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
      - if: always()
        run: docker compose logs --no-color > /tmp/compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: |
            reports/
            backend/target/surefire-reports/
            backend/target/site/jacoco/
            frontend/reports/
            frontend/test-results/
            frontend/playwright-report/
            /tmp/compose.log
